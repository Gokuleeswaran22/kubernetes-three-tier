name: Three Tier CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project files
        shell: powershell
        run: |
          if (!(Test-Path "backend/app.py")) {
            Write-Error "backend/app.py not found"
            exit 1
          }

          if (!(Test-Path "backend/Dockerfile")) {
            Write-Error "backend/Dockerfile not found"
            exit 1
          }

          if (!(Test-Path "backend/requirements.txt")) {
            Write-Error "backend/requirements.txt not found"
            exit 1
          }

          if (!(Test-Path "frontend/Dockerfile")) {
            Write-Error "frontend/Dockerfile not found"
            exit 1
          }

          Write-Host "Project files validated successfully"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        shell: powershell
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}" ./backend

      - name: Push backend Docker image
        shell: powershell
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}"

      - name: Build frontend Docker image
        shell: powershell
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}" ./frontend

      - name: Push frontend Docker image
        shell: powershell
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}"

      - name: Check Kubernetes connection
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Update backend deployment
        shell: powershell
        run: |
          kubectl set image deployment/backend "backend=${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.sha }}" -n three-tier

      - name: Update frontend deployment
        shell: powershell
        run: |
          kubectl set image deployment/frontend "frontend=${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.sha }}" -n three-tier

      - name: Wait for backend rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/backend -n three-tier --timeout=120s

      - name: Wait for frontend rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/frontend -n three-tier --timeout=120s

      - name: Verify application
        shell: powershell
        run: |
          kubectl get pods -n three-tier
          kubectl get services -n three-tier